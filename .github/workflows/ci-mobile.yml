name: Mobile Lint & Typecheck

on:
  pull_request:
    branches:
      - main

jobs:
  mobile-ci:
    name: Mobile Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @ai-platform/shared-types build

      - name: Lint mobile
        run: pnpm --filter @ai-platform/mobile lint

      - name: Typecheck mobile
        run: pnpm --filter @ai-platform/mobile typecheck
